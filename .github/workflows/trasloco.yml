name: Pagina del trasloco

# Chi apre ancora tomm4so00.github.io/casadolcecasa/ trova la pagina che lo porta su
# casadolcecasa.web.app con il suo accesso. La si ripubblica a mano quando cambia.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tomm4so00/casadolcecasa
          ref: main
          ssh-key: ${{ secrets.CODICE_DEPLOY_KEY }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pagina del trasloco
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_EMULATORS: 'false'
        run: |
          npm run build -- --base=/casadolcecasa/
          cp dist/trasloco.html dist/index.html
          mkdir -p site
          mv dist site/casadolcecasa
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://casadolcecasa.web.app/"><a href="https://casadolcecasa.web.app/">Casa dolce casa</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
